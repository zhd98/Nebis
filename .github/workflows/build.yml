name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The two runtime DLLs (Scintilla.dll + Lexilla.dll, from SciTE 5.6.6) are
      # vendored in runtime/ - no network download needed in CI.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release

      - name: Package artifact
        shell: msys2 {0}
        run: |
          mkdir -p artifact
          cp build/mdpad.exe artifact/
          cp runtime/Scintilla.dll artifact/
          cp runtime/Lexilla.dll artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: mdpad-win64
          path: artifact
